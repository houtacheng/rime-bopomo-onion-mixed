# 位置：~/Library/Rime/squirrel.custom.yaml
# 用法：想要哪項生效，就刪去該行行首的「#」字符，但注意保留用於縮進的空格

patch:

# ── 配色 ──────────────────────────────────────────────────────────
  style/color_scheme: sunda # 亮色主題
  style/color_scheme_dark: sunda # 暗色主題；想跟亮色一致就改成 luna

# ── 版面 ──────────────────────────────────────────────────────────
  style/candidate_list_layout: stacked # stacked 每個候選另起一行；linear 首尾相連成一串
  style/text_orientation: horizontal # horizontal 橫排；vertical 豎排
  style/inline_preedit: false # false 為雙行顯示：候選窗頂端保留正在打的注音預覽
  style/inline_candidate: true # 選中候選就地顯示在游標處，上下鍵選字時即時改寫
                                               # 註：終端機與 Electron 應用程式對行內編輯支援不一，
                                               # 有異常就改回 false，或在 app_options 對該程式設 no_inline: true

# ── 個別程式 ──────────────────────────────────────────────────────
# 就地顯示是把文字即時寫進應用程式的輸入區，而部分程式會把它當成真的輸入。
# Signal 就是一例：還在選字它就開始搜尋，上下鍵改候選也跟著改搜尋字串，
# 等到按 Return 時它的焦點早已跳到第一個搜尋結果，上屏的字就跑進那個對話框。
# 只對這類程式關掉就地顯示，其他程式照舊。
  "app_options/org.whispersystems.signal-desktop":
    no_inline: true
  style/status_message_type: mix # 切換方案時的提示樣式：long | short | mix
  style/mutual_exclusive: false # 候選窗與狀態提示是否互斥顯示
  style/memorize_size: true # linear 版面下記住候選窗長度，避免首選位置跳動
  style/show_paging: false # 候選窗是否顯示翻頁指示（Squirrel 1.x 起支援）

# ── 候選格式 ──────────────────────────────────────────────────────
  style/candidate_format: '[label]. [candidate] [comment]'
                                               # Squirrel 1.x 的原生語法，也是其預設值
                                               # 舊寫法 %c / %@ 仍可用，會被自動轉換成 [label] 與 [candidate] [comment]

# ── 字型 ──────────────────────────────────────────────────────────
  style/font_face: 'PingFangTC-Light' # 候選字與輸入碼
  style/font_point: 20
  style/comment_font_face: 'PingFangSC-Light' # 提示碼
  style/comment_font_point: 14
  style/label_font_face: 'Andale Mono' # 前標號
  style/label_font_point: 14
  # style/base_offset: 2                       # 文字垂直位置微調（正數向上／右）

# ── 幾何 ──────────────────────────────────────────────────────────
  style/corner_radius: 7 # 窗口圓角
  style/hilited_corner_radius: 0 # 候選條圓角
  style/border_height: -2 # 窗口邊界高度（需大於圓角半徑才看得出效果）
  style/border_width: -2 # 窗口邊界寬度
  style/line_spacing: 0 # 候選列之間的間隙
  style/spacing: 0 # 輸入碼區與候選區的間距
  # style/surrounding_extra_expansion: 5       # 非高亮候選項背景框縮放

# ── 視覺效果 ──────────────────────────────────────────────────────
  style/alpha: 1 # 整體不透明度（0–1）
  style/translucency: false # 毛玻璃背景（背景色半透明時才看得到）

