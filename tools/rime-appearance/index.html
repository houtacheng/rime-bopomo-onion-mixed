<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鼠鬚管外觀編輯器</title>
<style>
  :root{
    --bg:#f6f6f7; --panel:#fff; --ink:#1b1b1f; --muted:#6b6b76;
    --line:#e2e2e8; --accent:#3b6ef6; --accent-ink:#fff;
    --warn-bg:#fff4e5; --warn-ink:#7a4a00;
    --ok-bg:#e6f6ec; --ok-ink:#15603a;
    --err-bg:#fdecec; --err-ink:#8a1f1f;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#17171a; --panel:#1f1f24; --ink:#ececf1; --muted:#9a9aa6;
      --line:#32323a; --warn-bg:#3a2c14; --warn-ink:#ffd79a;
      --ok-bg:#14301f; --ok-ink:#8be0ac; --err-bg:#3a1c1c; --err-ink:#ffb4b4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0;font-weight:650}
  header .path{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:18px;
    padding:18px 20px;align-items:start}
  @media (max-width:900px){ .wrap{grid-template-columns:1fr} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:13px;margin:0 0 12px;font-weight:650;letter-spacing:.02em;color:var(--muted)}
  .row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;
    align-items:center;margin-bottom:9px}
  .row label{font-size:13px;color:var(--muted)}
  input[type=text],input[type=number],select{width:100%;padding:6px 8px;font:inherit;
    background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
  input[type=range]{width:100%}
  .inline{display:flex;gap:8px;align-items:center}
  .inline input[type=number]{width:78px;flex:none}
  button{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.small{padding:4px 9px;font-size:12px}
  .actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .msg{margin-top:11px;padding:9px 12px;border-radius:7px;font-size:13px;display:none}
  .msg.ok{display:block;background:var(--ok-bg);color:var(--ok-ink)}
  .msg.err{display:block;background:var(--err-bg);color:var(--err-ink)}
  .msg.warn{display:block;background:var(--warn-bg);color:var(--warn-ink)}
  /* 字型選擇器 */
  .fontbox{position:relative}
  .fontlist{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:3px;
    max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);display:none}
  .fontlist.open{display:block}
  .fontlist div{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .fontlist div:hover,.fontlist div.on{background:var(--bg)}
  .fontlist .ps{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;
    flex:none;align-self:center}
  .sample{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 配色 */
  .swatches{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
  .sw{width:20px;height:20px;border-radius:4px;border:1px solid var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cpick{display:flex;align-items:center;gap:7px;font-size:12px}
  .cpick input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--line);
    border-radius:5px;background:none;cursor:pointer}
  /* 預覽 */
  .previewpane{position:sticky;top:74px}
  .stage{padding:26px 18px;border-radius:10px;border:1px dashed var(--line);
    background:repeating-conic-gradient(#0000 0 25%,rgba(128,128,128,.09) 0 50%) 0 0/18px 18px;
    display:flex;justify-content:center}
  .panel{display:inline-block;text-align:left;max-width:100%}
  .cand{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .panel.linear .cands{display:flex;gap:10px;flex-wrap:wrap}
  .note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}
  .snaps{max-height:210px;overflow:auto}
  .snap{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .snap:last-child{border-bottom:0}
  .snap .when{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .snap .note2{color:var(--muted);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis}
  .loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>鼠鬚管外觀編輯器</h1>
  <span class="path" id="path"></span>
</header>

<div id="app" class="loading">載入中…</div>

<template id="tpl">
<div class="wrap">
  <div>
    <div class="card">
      <h2>配色</h2>
      <div class="row"><label>亮色主題</label><select id="color_scheme"></select></div>
      <div class="swatches" id="sw_light"></div>
      <div class="row" style="margin-top:12px"><label>暗色主題</label><select id="color_scheme_dark"></select></div>
      <div class="swatches" id="sw_dark"></div>
      <div class="actions" style="margin-top:14px">
        <button class="small" id="btn_newscheme">新增配色…</button>
        <span class="note" id="scheme_count"></span>
      </div>
      <div id="newscheme" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
        <div class="row"><label>名稱</label><input type="text" id="ns_name" placeholder="my_scheme"></div>
        <div class="grid2" id="ns_colors"></div>
        <div class="actions" style="margin-top:12px">
          <button class="primary small" id="ns_save">建立</button>
          <button class="small" id="ns_cancel">取消</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>字型</h2>
      <div class="row"><label>候選字</label><div class="fontbox" data-target="font_face"></div></div>
      <div class="row"><label>候選字大小</label>
        <div class="inline"><input type="range" id="font_point" min="9" max="48" step="1">
          <input type="number" id="font_point_n" min="9" max="48"></div></div>
      <div class="row"><label>提示碼</label><div class="fontbox" data-target="comment_font_face"></div></div>
      <div class="row"><label>提示碼大小</label>
        <div class="inline"><input type="range" id="comment_font_point" min="8" max="40" step="1">
          <input type="number" id="comment_font_point_n" min="8" max="40"></div></div>
      <div class="row"><label>標號</label><div class="fontbox" data-target="label_font_face"></div></div>
      <div class="row"><label>標號大小</label>
        <div class="inline"><input type="range" id="label_font_point" min="8" max="40" step="1">
          <input type="number" id="label_font_point_n" min="8" max="40"></div></div>
      <div class="actions"><button class="small" id="btn_refresh_fonts">重新掃描系統字型</button>
        <span class="note" id="font_count"></span></div>
    </div>

    <div class="card">
      <h2>版面</h2>
      <div class="row"><label>候選排列</label><select id="candidate_list_layout">
        <option value="stacked">stacked（每個候選一行）</option>
        <option value="linear">linear（首尾相連）</option></select></div>
      <div class="row"><label>文字方向</label><select id="text_orientation">
        <option value="horizontal">horizontal（橫排）</option>
        <option value="vertical">vertical（豎排）</option></select></div>
      <div class="row"><label>輸入碼位置</label><select id="inline_preedit">
        <option value="false">候選窗內（雙行，保留注音預覽）</option>
        <option value="true">游標處（單行）</option></select></div>
      <div class="row"><label>選中候選</label><select id="inline_candidate">
        <option value="false">只在候選窗顯示</option>
        <option value="true">就地顯示在游標處</option></select></div>
      <div class="row"><label>候選格式</label><input type="text" id="candidate_format"></div>
      <div class="row"><label>翻頁指示</label><select id="show_paging">
        <option value="false">不顯示</option><option value="true">顯示</option></select></div>
    </div>

    <div class="card">
      <h2>幾何與效果</h2>
      <div class="row"><label>窗口圓角</label><div class="inline">
        <input type="range" id="corner_radius" min="0" max="24" step="1">
        <input type="number" id="corner_radius_n" min="0" max="24"></div></div>
      <div class="row"><label>候選條圓角</label><div class="inline">
        <input type="range" id="hilited_corner_radius" min="0" max="24" step="1">
        <input type="number" id="hilited_corner_radius_n" min="0" max="24"></div></div>
      <div class="row"><label>邊界高度</label><div class="inline">
        <input type="range" id="border_height" min="-8" max="24" step="1">
        <input type="number" id="border_height_n" min="-8" max="24"></div></div>
      <div class="row"><label>邊界寬度</label><div class="inline">
        <input type="range" id="border_width" min="-8" max="24" step="1">
        <input type="number" id="border_width_n" min="-8" max="24"></div></div>
      <div class="row"><label>候選列間隙</label><div class="inline">
        <input type="range" id="line_spacing" min="0" max="24" step="1">
        <input type="number" id="line_spacing_n" min="0" max="24"></div></div>
      <div class="row"><label>輸入碼間距</label><div class="inline">
        <input type="range" id="spacing" min="0" max="24" step="1">
        <input type="number" id="spacing_n" min="0" max="24"></div></div>
      <div class="row"><label>不透明度</label><div class="inline">
        <input type="range" id="alpha" min="0.2" max="1" step="0.05">
        <input type="number" id="alpha_n" min="0.2" max="1" step="0.05"></div></div>
      <div class="row"><label>毛玻璃</label><select id="translucency">
        <option value="false">關閉</option><option value="true">開啟</option></select></div>
    </div>
  </div>

  <div class="previewpane">
    <div class="card">
      <h2>預覽</h2>
      <div class="stage" id="stage"></div>
      <p class="note">預覽是用瀏覽器模擬的，字型與顏色取自本機實際設定。
        毛玻璃、豎排文字等由系統繪製的效果無法完全重現，以實際輸入時為準。</p>
    </div>

    <div class="card">
      <h2>套用</h2>
      <div class="actions">
        <button class="primary" id="btn_apply">套用並部署</button>
        <button id="btn_reload">捨棄變更</button>
      </div>
      <div class="msg" id="msg"></div>
      <p class="note">每次套用前會自動建立快照，可以隨時退回。</p>
    </div>

    <div class="card">
      <h2>快照</h2>
      <div class="snaps" id="snaps"></div>
    </div>
  </div>
</div>
</template>

<script>
const $ = s => document.querySelector(s);
let STATE = null, SETTINGS = {}, SCHEMES = {}, FONTS = [];

const NUMS = ['font_point','comment_font_point','label_font_point','corner_radius',
  'hilited_corner_radius','border_height','border_width','line_spacing','spacing','alpha'];
const SELECTS = ['color_scheme','color_scheme_dark','candidate_list_layout','text_orientation',
  'inline_preedit','inline_candidate','show_paging','translucency'];
const BOOLS = ['inline_preedit','inline_candidate','show_paging','translucency'];
const FONTKEYS = ['font_face','comment_font_face','label_font_face'];

const PREVIEW_COLORS = [
  ['back_color','背景','#ffffff'], ['text_color','輸入碼','#333333'],
  ['candidate_text_color','候選字','#333333'], ['comment_text_color','提示碼','#888888'],
  ['label_color','標號','#888888'],
  ['hilited_candidate_back_color','選中背景','#3b6ef6'],
  ['hilited_candidate_text_color','選中文字','#ffffff'],
  ['border_color','邊框','#dddddd'],
];

async function boot(){
  const r = await fetch('/api/state');
  STATE = await r.json();
  SETTINGS = Object.assign({}, STATE.settings);
  SCHEMES = {}; STATE.schemes.forEach(s => SCHEMES[s.id] = s);
  FONTS = STATE.fonts;
  $('#path').textContent = STATE.rime_dir + '/squirrel.custom.yaml';
  $('#app').className = '';
  $('#app').innerHTML = '';
  $('#app').appendChild($('#tpl').content.cloneNode(true));
  buildSchemeSelects(); buildFontPickers(); buildNewSchemeColors();
  bindControls(); renderSnapshots(); syncFromSettings(); render();
}

function buildSchemeSelects(){
  const opts = STATE.schemes.map(s =>
    `<option value="${s.id}">${s.id}${s.label!==s.id?` — ${s.label}`:''}（${s.source}）</option>`).join('');
  $('#color_scheme').innerHTML = opts;
  $('#color_scheme_dark').innerHTML = opts;
  $('#scheme_count').textContent = `共 ${STATE.schemes.length} 個配色`;
}

function buildNewSchemeColors(){
  $('#ns_colors').innerHTML = PREVIEW_COLORS.map(([k,label,def]) =>
    `<label class="cpick"><input type="color" data-k="${k}" value="${def}">${label}</label>`).join('');
}

/* ---- 字型選擇器：每個項目用它自己的字型渲染 ---- */
function buildFontPickers(){
  document.querySelectorAll('.fontbox').forEach(box => {
    const key = box.dataset.target;
    box.innerHTML = `<input type="text" autocomplete="off" placeholder="搜尋字型…">
      <div class="fontlist"></div>`;
    const input = box.querySelector('input'), list = box.querySelector('.fontlist');
    const fill = q => {
      const ql = (q||'').toLowerCase();
      const hits = FONTS.filter(f => !ql || f.toLowerCase().includes(ql)).slice(0,300);
      list.innerHTML = hits.map(f =>
        `<div data-f="${f}"><span class="sample" style="font-family:'${f}',sans-serif">${f} 注音輸入 Aa 123</span>
         <span class="ps">${f}</span></div>`).join('') ||
        '<div style="color:var(--muted)">沒有符合的字型</div>';
    };
    input.addEventListener('focus', () => { fill(input.value); list.classList.add('open'); });
    input.addEventListener('input', () => { fill(input.value); list.classList.add('open'); });
    input.addEventListener('blur', () => setTimeout(() => list.classList.remove('open'), 180));
    list.addEventListener('mousedown', e => {
      const item = e.target.closest('[data-f]'); if(!item) return;
      SETTINGS[key] = item.dataset.f; input.value = item.dataset.f;
      input.style.fontFamily = `'${item.dataset.f}',sans-serif`;
      list.classList.remove('open'); render();
    });
    box._set = v => { input.value = v||''; input.style.fontFamily = v?`'${v}',sans-serif`:''; };
  });
  $('#font_count').textContent = `本機 ${FONTS.length} 個字型`;
}

function bindControls(){
  NUMS.forEach(k => {
    const r = $('#'+k), n = $('#'+k+'_n');
    const set = v => { SETTINGS[k] = parseFloat(v); r.value = v; n.value = v; render(); };
    r.addEventListener('input', e => set(e.target.value));
    n.addEventListener('input', e => set(e.target.value));
  });
  SELECTS.forEach(k => $('#'+k).addEventListener('change', e => {
    SETTINGS[k] = BOOLS.includes(k) ? e.target.value === 'true' : e.target.value;
    render();
  }));
  $('#candidate_format').addEventListener('input', e => {
    SETTINGS.candidate_format = e.target.value; render();
  });
  $('#btn_apply').addEventListener('click', apply);
  $('#btn_reload').addEventListener('click', () => location.reload());
  $('#btn_refresh_fonts').addEventListener('click', async ev => {
    ev.target.disabled = true; ev.target.textContent = '掃描中…（約 15 秒）';
    const r = await fetch('/api/fonts/refresh'); FONTS = (await r.json()).fonts;
    buildFontPickers(); syncFromSettings();
    ev.target.disabled = false; ev.target.textContent = '重新掃描系統字型';
  });
  $('#btn_newscheme').addEventListener('click', () => {
    const box = $('#newscheme');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  });
  $('#ns_cancel').addEventListener('click', () => $('#newscheme').style.display = 'none');
  $('#ns_save').addEventListener('click', saveScheme);
}

function syncFromSettings(){
  NUMS.forEach(k => { if(SETTINGS[k] != null){ $('#'+k).value = SETTINGS[k]; $('#'+k+'_n').value = SETTINGS[k]; } });
  SELECTS.forEach(k => { if(SETTINGS[k] != null) $('#'+k).value = String(SETTINGS[k]); });
  if(SETTINGS.candidate_format != null) $('#candidate_format').value = SETTINGS.candidate_format;
  document.querySelectorAll('.fontbox').forEach(b => b._set(SETTINGS[b.dataset.target]));
}

function colors(name){
  const s = SCHEMES[name];
  return (s && s.colors) || {};
}
function c(name, key, fallback){ return colors(name)[key] || fallback; }

function renderSwatches(id, scheme){
  const cs = colors(scheme);
  $(id).innerHTML = PREVIEW_COLORS.map(([k]) => cs[k]
    ? `<div class="sw" style="background:${cs[k]}" title="${k}"></div>` : '').join('');
}

function formatParts(fmt){
  // 支援 1.x 的 [label]/[candidate]/[comment] 與舊的 %c/%@
  let f = fmt || '[label]. [candidate] [comment]';
  f = f.replace(/%c/g,'[label]').replace(/%@/g,'[candidate] [comment]');
  return f;
}

function render(){
  const S = SETTINGS, name = S.color_scheme;
  renderSwatches('#sw_light', S.color_scheme);
  renderSwatches('#sw_dark', S.color_scheme_dark);

  const back = c(name,'back_color','#ffffff');
  const border = c(name,'border_color', back);
  const candCol = c(name,'candidate_text_color', c(name,'text_color','#333'));
  const labelCol = c(name,'label_color','#999');
  const commentCol = c(name,'comment_text_color','#999');
  const hiBack = c(name,'hilited_candidate_back_color','#3b6ef6');
  const hiText = c(name,'hilited_candidate_text_color','#fff');
  const textCol = c(name,'text_color','#333');

  const pad = Math.max(0, Number(S.border_height ?? 0));
  const padX = Math.max(0, Number(S.border_width ?? 0));
  const rows = [
    ['QY','你好','〔你好〕'], ['AH','妳好',''], ['ZN','尼好',''],
    ['WU','擬好',''], ['SJ','你號',''], ['XM','泥好','']
  ];
  const fmt = formatParts(S.candidate_format);
  const cell = (label, text, comment, hi) => {
    const html = fmt
      .replace('[label]', `<span style="font-family:'${S.label_font_face}',monospace;
        font-size:${S.label_font_point}px;color:${hi?hiText:labelCol}">${label}</span>`)
      .replace('[candidate]', `<span style="font-family:'${S.font_face}',sans-serif;
        font-size:${S.font_point}px;color:${hi?hiText:candCol}">${text}</span>`)
      .replace('[comment]', comment ? `<span style="font-family:'${S.comment_font_face}',sans-serif;
        font-size:${S.comment_font_point}px;color:${hi?hiText:commentCol}">${comment}</span>` : '');
    return `<div class="cand" style="padding:${Math.max(0,Number(S.line_spacing||0))/2}px 6px;
      border-radius:${S.hilited_corner_radius||0}px;
      background:${hi?hiBack:'transparent'}">${html}</div>`;
  };

  const preedit = S.inline_preedit ? '' :
    `<div style="font-family:'${S.font_face}',sans-serif;font-size:${S.font_point}px;
      color:${textCol};padding:0 6px ${Math.max(0,Number(S.spacing||0))}px">ㄋㄧˇㄏㄠˇ</div>`;

  $('#stage').innerHTML = `
    <div class="panel ${S.candidate_list_layout==='linear'?'linear':''}"
      style="background:${back};border-radius:${S.corner_radius||0}px;
      opacity:${S.alpha ?? 1};padding:${pad+6}px ${padX+6}px;
      border:1px solid ${border};box-shadow:0 6px 20px rgba(0,0,0,.18)">
      ${preedit}
      <div class="cands">${rows.map((r,i)=>cell(r[0],r[1],r[2],i===0)).join('')}</div>
      ${S.show_paging?`<div style="text-align:right;font-size:11px;color:${labelCol};padding:2px 6px 0">‹ 1/9 ›</div>`:''}
    </div>`;
}

function renderSnapshots(){
  const list = STATE.snapshots || [];
  $('#snaps').innerHTML = list.length ? list.map(s =>
    `<div class="snap"><span class="when">${s.label}</span>
      <span class="note2">${s.note||''}</span>
      <button class="small" data-id="${s.id}">還原</button></div>`).join('')
    : '<p class="note">還沒有快照。第一次套用時會自動建立。</p>';
  $('#snaps').querySelectorAll('button[data-id]').forEach(b =>
    b.addEventListener('click', () => rollback(b.dataset.id)));
}

function say(kind, text){
  const m = $('#msg'); m.className = 'msg ' + kind; m.textContent = text;
}

async function apply(){
  $('#btn_apply').disabled = true; say('warn','套用中…');
  const r = await fetch('/api/apply', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({settings: SETTINGS, note: '外觀編輯器'})});
  const d = await r.json();
  say(d.ok?'ok':'err', d.message);
  if(d.snapshots){ STATE.snapshots = d.snapshots; renderSnapshots(); }
  $('#btn_apply').disabled = false;
}

async function rollback(id){
  if(!confirm('要把 squirrel.custom.yaml 還原到這個快照嗎？\n（還原前會先自動備份目前狀態）')) return;
  say('warn','還原中…');
  const r = await fetch('/api/rollback', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
  const d = await r.json();
  say(d.ok?'ok':'err', d.message);
  if(d.settings){ SETTINGS = Object.assign({}, d.settings); syncFromSettings(); render(); }
  if(d.snapshots){ STATE.snapshots = d.snapshots; renderSnapshots(); }
}

async function saveScheme(){
  const name = $('#ns_name').value.trim();
  const cols = {};
  $('#ns_colors').querySelectorAll('input[type=color]').forEach(i => {
    const h = i.value;
    cols[i.dataset.k] = `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},1)`;
  });
  const r = await fetch('/api/scheme', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, colors: cols})});
  const d = await r.json();
  say(d.ok?'ok':'err', d.message);
  if(d.ok){
    STATE.schemes = d.schemes; SCHEMES = {}; d.schemes.forEach(s => SCHEMES[s.id]=s);
    buildSchemeSelects(); syncFromSettings();
    SETTINGS.color_scheme = name; $('#color_scheme').value = name;
    $('#newscheme').style.display='none'; render();
    if(d.snapshots){ STATE.snapshots = d.snapshots; renderSnapshots(); }
  }
}

boot();
</script>
</body>
</html>
